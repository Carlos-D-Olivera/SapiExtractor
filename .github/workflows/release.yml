name: Build release executable

# Builds SapiExtractor.exe for a version tag and publishes it, together with its
# SHA-256, as a GitHub Release. The app's "Actualizar" button downloads exactly
# these two files (SapiExtractor.exe and SHA256SUMS) from the latest release.
#
# It runs in three situations:
#   1. Automatically, after "Auto Merge to Main on Version Bump" succeeds. That
#      workflow merges develop into main and creates the tag V.X.Y.Z, but a tag
#      pushed with GITHUB_TOKEN does not start other workflows, hence workflow_run.
#      The version is read from sp-extractor-wails/wails.json.
#   2. When you publish a release by hand (Releases > Draft a new release).
#   3. Manually (Actions > Build release executable > Run workflow) for an
#      existing tag, e.g. to publish a tag that has no release yet.
#
# The release must not be a draft or pre-release, or the app will not offer it.

on:
  workflow_run:
    workflows: ["Auto Merge to Main on Version Bump"]
    types: [completed]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish, e.g. V.2.7.0'
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Build and publish SapiExtractor.exe
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout (full history and tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Keep the release-notes script (the tagged commit may be older than it)
        run: |
          if (Test-Path .github/scripts/release-notes.ps1) {
            Copy-Item .github/scripts/release-notes.ps1 (Join-Path $env:RUNNER_TEMP 'release-notes.ps1')
          }
          exit 0

      - name: Decide which tag to build
        id: tag
        run: |
          $trigger = '${{ github.event_name }}'
          switch ($trigger) {
            'workflow_run' {
              $json = Get-Content sp-extractor-wails/wails.json -Raw | ConvertFrom-Json
              $requested = 'V.' + ($json.info.productVersion -replace '^[vV]\.?', '')
            }
            'release' { $requested = '${{ github.event.release.tag_name }}' }
            default   { $requested = '${{ inputs.tag }}' }
          }
          $requested = "$requested".Trim()
          Write-Host "Requested tag: '$requested'"

          # Accept 2.7.1, v2.7.1 and V.2.7.1: use the existing tag with that version number.
          $wanted = $requested -replace '^[vV]\.?', ''
          $allTags = @(git tag -l)
          $tag = $allTags | Where-Object { ($_ -replace '^[vV]\.?', '') -eq $wanted } | Select-Object -First 1
          $global:LASTEXITCODE = 0

          if (-not $tag) {
            # After an automatic merge a missing tag just means the version did not change.
            if ($trigger -eq 'workflow_run') {
              Write-Host "The tag for version '$wanted' does not exist (the version did not change): nothing to publish."
              "skip=true" >> $env:GITHUB_OUTPUT
              exit 0
            }
            # A manual run must never "succeed" without publishing anything.
            throw "The tag '$requested' does not exist. Existing tags: $($allTags -join ', ')"
          }
          Write-Host "Building tag: $tag"

          # After an automatic merge, do not rebuild a version that is already published.
          if ('${{ github.event_name }}' -eq 'workflow_run') {
            $assets = @(gh release view $tag --repo $env:REPO --json assets --jq '.assets[].name' 2>$null)
            $released = ($LASTEXITCODE -eq 0 -and $assets -contains 'SapiExtractor.exe')
            # "release not found" is the normal case here; do not let gh's exit code 1
            # become the exit code of the whole step (pwsh uses the last native command's).
            $global:LASTEXITCODE = 0
            if ($released) {
              Write-Host "The release $tag already has SapiExtractor.exe: nothing to do."
              "skip=true" >> $env:GITHUB_OUTPUT
              exit 0
            }
          }

          "skip=false" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          $version = $tag -replace '^[vV]\.?', ''
          if ($version -notmatch '^\d+\.\d+\.\d+') { throw "The tag '$tag' is not a version number (expected V.X.Y.Z)" }
          "version=$version" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Use the tagged commit
        if: steps.tag.outputs.skip != 'true'
        run: git checkout --detach "${{ steps.tag.outputs.tag }}"

      - name: Set up Go
        if: steps.tag.outputs.skip != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: sp-extractor-wails/go.mod
          cache-dependency-path: sp-extractor-wails/go.sum

      - name: Set up Node
        if: steps.tag.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sp-extractor-wails/frontend/package-lock.json

      - name: Install the Wails CLI (same version as go.mod)
        if: steps.tag.outputs.skip != 'true'
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
          Join-Path (go env GOPATH) 'bin' >> $env:GITHUB_PATH

      # Build first: main.go embeds frontend/dist (not committed), so the main
      # package only compiles once the frontend has been built.
      - name: Build
        if: steps.tag.outputs.skip != 'true'
        working-directory: sp-extractor-wails
        run: wails build -clean -platform windows/amd64 -ldflags "-X main.version=${{ steps.tag.outputs.version }}"

      - name: Go tests
        if: steps.tag.outputs.skip != 'true'
        working-directory: sp-extractor-wails
        run: go test ./...

      - name: Checksums
        if: steps.tag.outputs.skip != 'true'
        working-directory: sp-extractor-wails/build/bin
        run: |
          if (-not (Test-Path SapiExtractor.exe)) { throw 'SapiExtractor.exe was not produced' }
          $hash = (Get-FileHash SapiExtractor.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  SapiExtractor.exe" | Out-File -FilePath SHA256SUMS -Encoding ascii
          Get-Content SHA256SUMS

      - name: Release notes from the commit messages
        if: steps.tag.outputs.skip != 'true'
        run: |
          $script = Join-Path $env:RUNNER_TEMP 'release-notes.ps1'
          if (Test-Path $script) {
            & $script -Tag '${{ steps.tag.outputs.tag }}' -Repo $env:REPO -Out (Join-Path $env:RUNNER_TEMP 'release-notes.md')
          } else {
            Write-Host 'The notes script is not available: GitHub will generate the notes.'
          }
          exit 0

      - name: Publish the release
        if: steps.tag.outputs.skip != 'true'
        working-directory: sp-extractor-wails
        run: |
          $tag = '${{ steps.tag.outputs.tag }}'
          gh release view $tag --repo $env:REPO *> $null
          if ($LASTEXITCODE -ne 0) {
            $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
            $notesArgs = if (Test-Path $notes) { @('--notes-file', $notes) } else { @('--generate-notes') }
            gh release create $tag build/bin/SapiExtractor.exe build/bin/SHA256SUMS --repo $env:REPO --title $tag @notesArgs --verify-tag
          } else {
            gh release upload $tag build/bin/SapiExtractor.exe build/bin/SHA256SUMS --clobber --repo $env:REPO
          }
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the release failed' }
